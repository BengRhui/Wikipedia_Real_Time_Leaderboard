[package]
name = "wiki_rt"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["stream", "blocking"] }
tokio-stream = "0.1.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures = "0.3.32"
dashmap = "7.0.0-rc2"
bytes = "1.11.1"
chrono = "0.4.44"
rand = "0.9.4"

[dev-dependencies]
criterion = { version = "0.8.2"}

[[bench]]
name = "pipeline_benchmark"
harness = false
